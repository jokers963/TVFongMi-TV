name: Windows release

on:
  push:
    tags:
      - windows-v*

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained Windows app
        run: dotnet publish windows/TVFongMi.Windows.csproj --configuration Release --self-contained true -r win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/TVFongMi-Windows
      - name: Create archive
        run: Compress-Archive -Path artifacts/TVFongMi-Windows/* -DestinationPath TVFongMi-Windows-win-x64.zip
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: TVFongMi-Windows-win-x64.zip
