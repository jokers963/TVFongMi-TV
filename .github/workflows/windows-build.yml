name: Windows client build

on:
  push:
    branches: [ windows-port ]
  pull_request:
    branches: [ windows-port ]

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore windows/TVFongMi.Windows.csproj
      - name: Build Windows client
        run: dotnet build windows/TVFongMi.Windows.csproj --configuration Release --no-restore
      - name: Publish Windows client
        run: dotnet publish windows/TVFongMi.Windows.csproj --configuration Release --self-contained true -r win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/TVFongMi-Windows --no-restore
      - uses: actions/upload-artifact@v4
        with:
          name: TVFongMi-Windows
          path: artifacts/TVFongMi-Windows
          if-no-files-found: error
